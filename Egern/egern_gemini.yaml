# ================= 分流规则 (严格遵循 OpenClash 十段式顺序) =================
rules:
  # 🏠 ① 局域网 IP 与私有域名最先放行
  - rule_set:
      name: 局域网与私有域名
      match: https://raw.githubusercontent.com/IBL3ND/rule/refs/heads/main/LAN.list
      policy: DIRECT

  # ⚡ 抖音、拼多多、淘宝天猫快速直连
  - domain_suffix:
      match: douyin.com
      policy: DIRECT
  - rule_set:
      name: 抖音分流
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/DouYin/DouYin.list
      policy: DIRECT
  - rule_set:
      name: 拼多多分流
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Pinduoduo/Pinduoduo.list
      policy: DIRECT
  - domain_suffix:
      match: taobao.com
      policy: DIRECT
  - domain_suffix:
      match: tmall.com
      policy: DIRECT
  - domain_suffix:
      match: alicdn.com
      policy: DIRECT
  - domain_suffix:
      match: tbcdn.cn
      policy: DIRECT
  - domain_suffix:
      match: tbcache.com
      policy: DIRECT

  # 🛑 ② 广告拦截 (先行硬拦截海外 Google Ads 防超时，其余走 🛑 广告拦截 策略组)
  - domain_suffix:
      match: clients6.google.com
      policy: REJECT
  - domain_suffix:
      match: doubleclick.net
      policy: REJECT
  - domain_suffix:
      match: googleadservices.com
      policy: REJECT
  - domain_suffix:
      match: googlesyndication.com
      policy: REJECT
  - rule_set:
      name: 广告拦截合集
      match: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Loon/rule/rejectAd.list
      policy: 🛑 广告拦截

  # 🔧 ③ 用户自定义强制规则
  - domain:
      match: dl.bd2.pmang.cloud
      policy: 🇺🇲 美国节点
  - rule_set:
      name: 个人自定义直连
      match: https://raw.githubusercontent.com/b1oodream/rule/refs/heads/main/clash/MyDirect.list
      policy: DIRECT
  - rule_set:
      name: 个人自定义代理
      match: https://raw.githubusercontent.com/b1oodream/rule/refs/heads/main/clash/MyProxy.list
      policy: 🚀 默认代理

  # 🏦 ④ 关键服务直连 (银行 / 微软 / 苹果 / 谷歌中国)
  - rule_set:
      name: 中国银行服务
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaBank/ChinaBank.list
      policy: DIRECT
  - rule_set:
      name: 微软中国服务
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Microsoft/Microsoft.list
      policy: DIRECT
  - rule_set:
      name: 苹果中国服务
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Apple/Apple.list
      policy: DIRECT
  - rule_set:
      name: 谷歌中国服务
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GoogleCN/GoogleCN.list
      policy: DIRECT

  # 🎮 ⑤ 游戏服务与平台分流
  - rule_set:
      name: 游戏平台分流
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Game/Game.list
      policy: 🎮 Game

  # 🤖 ⑥ 国际专属服务
  - rule_set:
      name: AI服务合集
      match: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Loon/rule/AI.list
      policy: 🤖 AI服务
  - rule_set:
      name: 加密货币
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Crypto/Crypto.list
      policy: 🚀 默认代理
  - rule_set:
      name: GitHub
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GitHub/GitHub.list
      policy: 🚀 默认代理
  - rule_set:
      name: YouTube
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/YouTube/YouTube.list
      policy: 📹 YouTube
  - rule_set:
      name: Google
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Google/Google.list
      policy: 🍀 Google
  - rule_set:
      name: OneDrive
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/OneDrive/OneDrive.list
      policy: 🚀 默认代理
  - rule_set:
      name: PayPal
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/PayPal/PayPal.list
      policy: 🚀 默认代理
  - rule_set:
      name: Twitch
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Twitch/Twitch.list
      policy: 🇺🇲 美国节点

  # 🎬 媒体分流
  - rule_set:
      name: 国内媒体
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.list
      policy: DIRECT
  - rule_set:
      name: 国际流媒体
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GlobalMedia/GlobalMedia.list
      policy: 🇺🇲 美国节点

  # 📲 ⑦ 通讯软件
  - rule_set:
      name: Telegram
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Telegram/Telegram.list
      policy: 🚀 默认代理

  # 🍎 ⑧ Apple 兜底服务
  - rule_set:
      name: Apple全量
      match: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Loon/rule/AppleAll.list
      policy: DIRECT

  # 🌍 ⑨ 国内外域名与 IP 兜底分流
  - rule_set:
      name: 海外代理列表
      match: https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_proxy_list.module
      policy: 🚀 默认代理
  - rule_set:
      name: 大陆全量域名与IP
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaMax/ChinaMax.list
      policy: DIRECT
  - rule_set:
      name: 国内GeoIP
      match: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Loon/rule/GeoIP_CN.list
      policy: DIRECT

  # 🐟 ⑩ 最终匹配
  - default:
      policy: 🐟 漏网之鱼

# ================= 重写与精简模块 (保留实用基础组件) =================
url_rewrites:
  - match: ^https?:\/\/(www.)?(g|google)\.cn
    location: https://www.google.com
    status_code: 302

mitm:
  ca_p12: egern.p12
  ca_passphrase: egern

modules:
  - name: 'Script Hub: 重写 & 规则集转换'
    url: https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/refs/heads/main/modules/script-hub.beta.egern.yaml
    enabled: true
  - name: Sub-Store
    url: https://raw.githubusercontent.com/sub-store-org/Sub-Store/refs/heads/master/config/Egern.yaml
    enabled: true
  - name: BoxJs
    url: https://raw.githubusercontent.com/chavyleung/scripts/master/box/rewrite/boxjs.rewrite.surge.sgmodule
    enabled: true
  - url: https://raw.githubusercontent.com/unknowntokyo/surge-list/master/Egern/IP_Check.yaml
    compat_arguments:
      指定策略组: 🚀 默认代理
    env:
      SHOW_SPEED_TEST: 开启
      SPEED_TEST_PACKET: 4MB
      SPEED_TEST_TIMEOUT: 5秒
      SHOW_IPPURE: 开启
    enabled: true

default_subscription_group: 🌐 全部节点
default_proxy_group: 🚀 默认代理